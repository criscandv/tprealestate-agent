# Pre-commit de tprealestate-agent (FastAPI + uv + ruff).
# Instalar una vez por clon:  uv run pre-commit install
# Ejecutar manualmente:       uv run pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(app|alembic|scripts|tests)/.*\.py$
      - id: ruff-format
        files: ^(app|alembic|scripts|tests)/.*\.py$

  - repo: local
    hooks:
      - id: pytest
        name: pytest (tprealestate-agent)
        language: system
        entry: bash -c 'uv run pytest'
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
